format: vendor-envelope
rfc9457: false
summary: >-
  ADVANCE.AI does not use HTTP status codes or RFC 9457 problem+json. Every Open API call returns
  HTTP 200 with a JSON envelope, and the `code` string carries the real outcome. ADVANCE.AI's own
  Glossary instructs clients to branch on `code` and NOT on `message`, because message text changes
  without notice. The `code` also decides billing: each documented code carries a `free` or `pay`
  tag, and a `pay` code is charged even when it describes a failure.
envelope:
  transport_status: 200
  fields:
  - name: code
    description: The ADVANCE.AI status code. The authoritative outcome field.
  - name: message
    description: Human explanation. Explicitly NOT stable — do not branch on it.
  - name: data
    description: Operation-specific payload; null on most errors.
  - name: extra
    description: Exception message. Usually empty.
  - name: transactionId
    description: Request id, max 64 characters. ADVANCE.AI strongly recommends persisting it for support.
  - name: pricingStrategy
    description: FREE or PAY — whether this response was billed.
shared_codes:
- code: SUCCESS
  billed: pay
  message: OK
  meaning: The call succeeded. Note some operations return SUCCESS with pricingStrategy FREE; check per-operation.
  action: Proceed.
- code: ERROR
  billed: free
  message: Server error
  meaning: Unclassified server-side failure.
  action: Retry with backoff; escalate to ADVANCE.AI support with the transactionId.
- code: EMPTY_PARAMETER_ERROR
  billed: free
  message: Parameter should not be empty
  meaning: A mandatory parameter (one without an `optional` tag) was omitted.
  action: Fix the request. Do not retry unchanged.
- code: PARAMETER_ERROR
  billed: free
  message: Varies — detailed error description
  meaning: >-
    Malformed or illegal parameter. Documented variants include "Parameter should not be empty",
    "Timestamp error", "Signature error", "Parameter error, please check your request whether has
    illegal parameters", and phone-number format errors. ADVANCE.AI's stated phone format is country
    code + number with no leading zero, dash or space.
  action: Fix the request. Do not retry unchanged.
- code: IAM_FAILED
  billed: free
  message: Access denied (several variants)
  meaning: >-
    Identity and Access Management rejection. Variants — not authorized by IAM, Access Key not
    found, Token not found or expired, Access Key not found or expired, Account not authorized for
    this country, Account not authorized for this domain, Account is expired, Account is disabled.
  action: Re-obtain a token; if it persists, the account entitlement is the problem — contact the sales manager.
- code: INSUFFICIENT_BALANCE
  billed: free
  message: Insufficient balance, please top up or contact your sales manager for help
  meaning: Prepaid balance exhausted.
  action: Top up. Retrying will not succeed.
- code: SERVICE_BUSY
  billed: free
  message: Rate limit is exceeded / Quota exceeded
  meaning: >-
    Rate limit or daily free-query quota exceeded. ADVANCE.AI returns a Retry-After HTTP header
    (documented example "Retry-After: 10s") and notes this code "may migrate to HTTP 429 Too Many
    Requests in the future".
  action: Honour Retry-After and back off. See rate-limits/advanceai-rate-limits.yml.
- code: OVER_QUERY_LIMIT
  billed: free
  message: Quota exceeded — free query quota, or free query quota for test account
  meaning: The free query allocation for the account or test account is used up.
  action: Contact the sales manager for a paid allocation.
- code: CLIENT_ERROR
  billed: free
  message: HTTP client error, e.g. "HTTP 400 - Bad Request", "HTTP 404 - Not Found", "HTTP 405 - Method Not Allowed"
  meaning: The request itself was malformed at the HTTP layer — wrong path, wrong verb, wrong content type.
  action: Re-read the API reference. Do not retry unchanged.
- code: RETRY_LATER
  billed: free
  message: Query failed, please retry after the suggested time in HTTP Header
  meaning: Transient failure with an explicit retry hint.
  action: Honour the Retry-After header.
