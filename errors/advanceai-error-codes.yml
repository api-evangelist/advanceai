billing_note: >-
  This is the unusual property of the ADVANCE.AI error model and an agent must be told about it:
  four face-comparison FAILURE codes are tagged `pay`. NO_FACE_DETECTED_FROM_FIRST_IMAGE,
  NO_FACE_DETECTED_FROM_SECOND_IMAGE, FIRST_IMAGE_LOW_QUALITY_FACE and
  SECOND_IMAGE_LOW_QUALITY_FACE all bill. Blind retry of a bad image costs money each attempt;
  validate format, size and dimensions client-side before calling.
