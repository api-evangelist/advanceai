summary: >-
  ADVANCE.AI ships first-party MOBILE CAPTURE SDKs, not server-side API client libraries. Android
  is distributed from the company's own Nexus Maven repository at public-n3.advai.net; iOS is
  distributed as a zipped xcframework bundle from an Alibaba Cloud OSS bucket. There is no
  first-party JavaScript, Python, Java, Go, Ruby, PHP, .NET or Rust client for the HTTP API on any
  public registry — the server-side integration is expected to be hand-rolled against the nine
  documented endpoints.
