  name: ADVANCE.AI Open API
  description: >-
    eKYC building blocks — token authentication, Global Document Verification (SDK licensing, OCR
    field extraction, ID forgery detection), face comparison, and liveness detection with video
    evidence and PII data retention. All calls carry a short-lived access token in the
    X-ACCESS-TOKEN header and share one response envelope; HTTP is always 200 and the `code` field
    carries the outcome and the billing decision.
