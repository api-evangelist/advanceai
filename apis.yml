aid: advanceai
name: ADVANCE.AI
description: >-
  ADVANCE.AI is the digital identity verification, KYC/KYB, AML, compliance and risk-management
  business unit of Advance Intelligence Group, headquartered in Singapore and founded in 2016. Its
  AdvanGuard product line covers identity verification, document verification, face authentication
  and Know Your Business checks for banking and financial services, fintech, crypto, payments,
  e-commerce and the sharing economy, with a strong footprint across Southeast Asia and other
  emerging markets. ADVANCE.AI publishes a public Open API at api.advance.ai documented at
  doc.advance.ai — token authentication, Global Document Verification with OCR field extraction and
  ID forgery detection, face comparison, and liveness detection with video evidence and PII data
  retention — plus first-party Android and iOS capture SDKs distributed from its own Maven and
  object-storage endpoints. Onboarding is sales-led: there is no self-service sign-up and no
  published pricing, and platform access keys are issued through the Websaas platform.
