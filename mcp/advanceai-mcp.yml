caveats:
- No MCP server exists. Do not present this file as an agent-callable surface.
- The input schemas trace to a spec API Evangelist authored from documentation, not to a provider-published contract.
- Two mobile SDK steps sit inside both the document-verification and liveness flows. An agent cannot complete either flow end to end over HTTP alone — a human must present a document or a face to a phone camera. This is the structural reason ADVANCE.AI is a poor fit for a fully autonomous agent surface, and it should be stated plainly rather than papered over with tools.
