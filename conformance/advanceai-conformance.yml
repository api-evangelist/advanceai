  machine_readable: false
  caveat: >-
    Each item below is published as a .webp certificate image with no accompanying text. The
    certificate number, issuing scope, covered entity and expiry date are not published in a form
    any machine can read, and were not read from the images. Presence of the badge is the finding;
    the scope of the certification is NOT asserted.
  items:
