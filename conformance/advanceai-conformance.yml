    note: BSI is an accredited certification body. The specific standard certified is not stated in text on the page.
  - name: iBeta Level 1
    asset: https://advance.ai/wp-content/uploads/2025/08/iBeta-Level1cert.webp
    permalink: https://advance.ai/homepage/ibeta-level1cert/
    standard_named_in_text: false
    relates_to: Presentation Attack Detection testing for the liveness product.
  - name: iBeta Level 2
    asset: https://advance.ai/wp-content/uploads/2025/08/iBeta-Level2cert.webp
    permalink: https://advance.ai/homepage/ibeta-level2cert/
    standard_named_in_text: false
    relates_to: Presentation Attack Detection testing for the liveness product.
  not_claimed:
  - standard: ISO 27001
    reason: >-
      Named on the page only as a generic example of a regulatory standard ("Regulatory standards
      like PCI DSS, HIPAA, and ISO 27001 prescribe recommendations..."), not as a certification
      ADVANCE.AI holds. Not credited.
  - standard: PCI DSS
    reason: Same sentence. Named as an example, not claimed. Not credited.
  - standard: HIPAA
    reason: Same sentence. Named as an example, not claimed. Not credited.
  - standard: SOC 2
    reason: Not mentioned anywhere on the public site.
privacy:
  privacy_policy: https://advance.ai/privacy-policy/
  privacy_notice: https://advance.ai/privacy-notice/
  terms: https://advance.ai/terms-of-service/
  data_deletion_api: >-
    clearLivenessPiiData (GET /liveness/ext/v1/clear-data) is offered explicitly "if there are
    compliance requirements ... to clean up PII data". A programmatic erasure endpoint is a genuine
    and uncommon privacy affordance in this category.
