summary: >-
  ADVANCE.AI runs a public incident.io status page and publishes an explicit SDK version-support
  ladder that names which versions still receive updates. It does not publish an API versioning
  policy, an RFC 8594 Deprecation/Sunset header contract, an SLA, or a dated changelog. The
  deprecation signal that does exist is real but narrow: it governs the mobile SDKs and one
  response field, not the HTTP API versions.
status_page:
  url: https://status.advance.ai/
  platform: incident.io
  verified: probed
  http_status: 200
  fetched: '2026-09-07'
  components: >-
    Two component groups, CV and ICS, six components each. At fetch time two incidents were open —
    "Elevated error rates in liveness-detection" (investigating, ongoing 22 hours) and "Elevated
    error rates in curp-info-check" (investigating, ongoing 5 days).
  subscribe: true
  history: Calendar view of incident history is published.
  note: >-
    A legacy Atlassian Statuspage also answers at https://advanceai.statuspage.io/ titled "ADVANCE
    AI Status" (HTTP 200, fetched 2026-09-07). status.advance.ai is the current canonical surface.
  incidental_finding: >-
    The status page names a component "curp-info-check" that has no corresponding page in the
    public API reference. CURP is the Mexican national identity number, so ADVANCE.AI operates at
    least one production API — and likely a family of country-specific identity-check endpoints —
    that the public documentation does not describe. The published reference is a subset of the
    running surface.
versioning:
  policy_published: false
  style: path segment, per service, unsynchronised
  current_versions:
    authentication: v1
    document_verification: v1
    face_recognition: v4
    liveness_license: v1
    liveness_detection_result: v3
    liveness_ext: v1
  note: >-
    Each service carries its own path version and they do not move together. No policy states how
    long a previous path version stays callable, whether older versions are still served, or how a
    breaking change is announced. There is no version header and no version negotiation.
